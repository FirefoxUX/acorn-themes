name: "Release"

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: "ubuntu-latest"
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: "write"

    steps:
      - name: Check out Git repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Compute release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="release-$(date -u +%Y-%m-%d)"
          tag="$base"
          suffix=1
          while gh api "repos/${{ github.repository }}/git/refs/tags/$tag" --silent >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            tag="${base}-${suffix}"
          done
          echo "Using release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build themes
        run: npm run build

      - name: Package .xpi files
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          mkdir -p xpis artifacts
          for dir in dist/*/*/; do
            if [ -f "$dir/manifest.json" ]; then
              collection=$(basename "$(dirname "$dir")")
              theme=$(basename "$dir")
              theme_version=$(jq -r '.version' "$dir/manifest.json")
              mkdir -p "xpis/${collection}"
              (
                cd "$dir"
                zip -qr "${GITHUB_WORKSPACE}/xpis/${collection}/${theme}-${theme_version}.xpi" .
              )
            fi
          done
          # Collections with a single theme ship that .xpi directly; collections
          # with multiple themes are bundled into one zip per collection.
          for collection_dir in xpis/*/; do
            collection=$(basename "$collection_dir")
            xpi_count=$(find "$collection_dir" -maxdepth 1 -name '*.xpi' | wc -l)
            if [ "$xpi_count" -eq 1 ]; then
              cp "$collection_dir"*.xpi artifacts/
            else
              (
                cd "$collection_dir"
                zip -qr "${GITHUB_WORKSPACE}/artifacts/${collection}-${RELEASE_TAG}.zip" .
              )
            fi
          done
          ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          fail_on_unmatched_files: true
